name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

env:
  UV_DYNAMIC_VERSIONING_BYPASS: "2.2.0"
  PDM_BUILD_SCM_VERSION: "2.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov mypy interrogate build
        pip install https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.4/ml_ecosystem_snapshots-0.0.4-py3-none-any.whl
        if [ -f "requirements.txt" ]; then pip install -r requirements.txt || true; fi
        if [ -f "requirements-test.txt" ]; then pip install -r requirements-test.txt || true; fi
        if [ -f "pyproject.toml" ]; then pip install --no-deps -e . || true; fi

    - name: Check 3rd-Party Dependencies
      run: python scripts/check_3rdparty_deps.py

    - name: Check Code Formatting (Ruff)
      run: ruff format --check .

    - name: Check Linting (Ruff)
      run: ruff check .

    - name: Check Static Types (Mypy)
      run: mypy src tests scripts

    - name: Check Docstring Coverage (Interrogate)
      run: interrogate -v --fail-under=100 src tests scripts

    - name: API Parity Check
      run: python scripts/check_api_parity.py

    - name: Test Parity Check
      run: python scripts/check_test_parity.py

    - name: Test & Coverage
      run: |
        pytest --cov=src --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=100

    - name: Update Badges
      run: |
        python scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Build Package
      run: python -m build
