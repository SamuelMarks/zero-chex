name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

env:
  UV_DYNAMIC_VERSIONING_BYPASS: "2.2.0"
  PDM_BUILD_SCM_VERSION: "2.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zero-chex
    steps:
    - uses: actions/checkout@v7
      with:
        path: zero-chex

    - name: Checkout zero-jax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-jax
        path: zero-jax

    - name: Checkout zero-flax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-flax
        path: zero-flax

    - name: Checkout zero-grain
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-grain
        path: zero-grain

    - name: Checkout zero-optax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-optax
        path: zero-optax

    - name: Checkout zero-orbax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-orbax
        path: zero-orbax

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov mypy interrogate build pydantic colorama
        pip install "cdd @ git+https://github.com/offscale/cdd-python.git@master"
        pip install --ignore-requires-python --no-deps \
          "griffelib @ git+https://github.com/SamuelMarks/griffe.git@rest#subdirectory=packages/griffelib" \
          "griffecli @ git+https://github.com/SamuelMarks/griffe.git@rest#subdirectory=packages/griffecli" \
          "griffe @ git+https://github.com/SamuelMarks/griffe.git@rest"
        pip install \
          "ml-switcheroo-ir @ https://github.com/SamuelMarks/ml-switcheroo-ir/releases/download/v0.0.4/ml_switcheroo_ir-0.0.4-py3-none-any.whl" \
          "ml-switcheroo-compiler @ https://github.com/SamuelMarks/ml-switcheroo-compiler/releases/download/v0.0.1/ml_switcheroo_compiler-0.0.1-py3-none-any.whl"
        pip install --no-deps \
          "ml-ecosystem-snapshots @ https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.5/ml_ecosystem_snapshots-0.0.5-py3-none-any.whl"
        pip install --no-deps -e ../zero-jax
        pip install --no-deps -e ../zero-flax
        pip install --no-deps -e ../zero-grain
        pip install --no-deps -e ../zero-optax
        pip install --no-deps -e ../zero-orbax
        pip install --no-deps -e .

    - name: Check 3rd-Party Dependencies
      run: python scripts/check_3rdparty_deps.py

    - name: Check Code Formatting (Ruff)
      run: ruff format --check .

    - name: Check Linting (Ruff)
      run: ruff check .

    - name: Check Static Types (Mypy)
      run: mypy src tests scripts

    - name: Check Docstring Coverage (Interrogate)
      run: interrogate -v --fail-under=100 src tests scripts

    - name: API Parity Check
      run: python scripts/check_api_parity.py

    - name: API Compliance Check
      run: python scripts/check_compliance.py

    - name: Test Parity Check
      run: python scripts/check_test_parity.py

    - name: Test & Coverage
      run: |
        pytest --cov=src --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=100

    - name: Update Badges
      run: |
        python scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Build Package
      run: python -m build
