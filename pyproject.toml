[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "zero_chex"
version = "0.1.90"
description = "A zero-dependency compliance-focused implementation of chex"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["dependencies", "optional-dependencies"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
dev = ["requirements-dev.txt"]
test = ["requirements-test.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/zero_chex"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "I",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D401",
    "D417",
    "ANN",
]
ignore = ["ANN401", "UP007"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.9"
mypy_path = ["src", "../ml-switcheroo-ir/src", "../ml-ecosystem-snapshots/src"]
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
strict = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
strict_equality = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
disable_error_code = ["override"]

[[tool.mypy.overrides]]
module = ["pytest", "_pytest.*", "ml_ecosystem_snapshots", "ml_ecosystem_snapshots.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["tests.conftest"]
disallow_untyped_decorators = false

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    '\.\.\.',
]

[tool.interrogate]
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
ignore-overloaded-functions = true
fail-under = 100
exclude = ["setup.py", "docs", "build", "dist"]

[tool.pytest.ini_options]
pythonpath = ["src", "../ml-switcheroo-ir/src", "../ml-ecosystem-snapshots/src"]
addopts = "--cov=src --cov-branch --cov-report=term-missing --cov-fail-under=100"
